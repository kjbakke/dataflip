<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="3" refY="5" markerUnits="userSpaceOnUse" markerWidth="34" markerHeight="34" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#FFFFFF"/>
    </marker>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- database: three stacked disks -->
  <g fill="url(#disk)">
    <path d="M78 92c0-13 22.4-22 50-22s50 9 50 22v72c0 13-22.4 22-50 22s-50-9-50-22z"/>
  </g>
  <g fill="none" stroke="#4F46E5" stroke-opacity=".35" stroke-width="6" stroke-linecap="round">
    <path d="M78 116c0 13 22.4 22 50 22s50-9 50-22"/>
    <path d="M78 140c0 13 22.4 22 50 22s50-9 50-22"/>
  </g>
  <ellipse cx="128" cy="92" rx="50" ry="22" fill="#FFFFFF"/>
  <ellipse cx="128" cy="92" rx="34" ry="12" fill="#5EEAD4" fill-opacity=".55"/>

  <!-- flip: two arrows circling the database -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" marker-end="url(#head)">
    <path d="M210 120A84 84 0 0 0 104 46"/>
    <path d="M46 136A84 84 0 0 0 152 210"/>
  </g>
